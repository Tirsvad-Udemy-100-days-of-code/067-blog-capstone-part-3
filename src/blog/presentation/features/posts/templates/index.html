{% extends "base.html" %}
{% block content %}
  {% for post in posts %}
    <article class="mb-4">
      <h2>
        <a href="{{ url_for('posts.show_post', post_id=post.post_id) }}">{{ post.title }}</a>
        <a class="text-danger text-decoration-none" href="{{ url_for('posts.delete_post', post_id=post.post_id) }}" title="Delete post" aria-label="Delete post: {{ post.title }}">✘</a>
      </h2>
      <p class="lead">{{ post.subtitle }}</p>
      <p class="text-muted">Posted by {{ post.author }} on {{ post.posted_on_text }}</p>
    </article>
  {% else %}
    <p>There are no posts yet.</p>
  {% endfor %}
  <a class="btn btn-primary" href="{{ url_for('posts.add_new_post') }}">New Post</a>
{% endblock %}
